services:
  api:
    build: .
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=atlantis_nexus_db;Username=postgres;Password=rootpassword
    depends_on:
      - postgres
      - migrations
    restart: on-failure

  migrations:
    build:
      context: .
      dockerfile: migrations.Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=atlantis_nexus_db;Username=postgres;Password=rootpassword
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    container_name: atlantis-nexus-pg
    environment:
      POSTGRES_DB: atlantis_nexus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
