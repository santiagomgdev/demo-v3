services:
  postgres:
    image: postgres:16
    container_name: atlantis-nexus-pg
    environment:
      POSTGRES_DB: atlantis_nexus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
